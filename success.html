<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - Coffee Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #faf4f5;
        }

        .success-box {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .success-box h1 {
            color: #3b141c;
            margin-bottom: 15px;
        }

        .success-box p {
            color: #555;
            line-height: 1.6;
        }

        .success-icon {
            font-size: 50px;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            color: white;
            background: #3b141c;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .back-button:hover {
            background: #f3961c;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="success-icon">☕</div>

        <h1>Order Received!</h1>

        <p>
            Thank you for your order.
        </p>

        <p>
            Your order has been submitted successfully.
            We will contact you soon.
        </p>

    <div id="order-details">

     <p>
        <strong>Product:</strong>
        <span id="order-product"></span>
     </p>

     <p>
        <strong>Quantity:</strong>
        <span id="order-quantity"></span>
     </p>

     <p>
        <strong>Total:</strong>
        <span id="order-total"></span>
     </p>

    </div>

        <a href="index.html" class="back-button">
            ← Back to Home
        </a>

    </div>

    <script>

        const orderDetails = JSON.parse(
            localStorage.getItem("orderDetails")
        );

        if (orderDetails) {

            document.querySelector("#order-product").textContent =
                orderDetails.product;

            document.querySelector("#order-quantity").textContent =
                orderDetails.quantity;

            document.querySelector("#order-total").textContent =
                orderDetails.total;
        }

    </script>


</body>

</html>
